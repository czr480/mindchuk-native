<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MindChuk Canvas</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #0b0c10; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: #c5a3ff; user-select: none; }
        #canvas-container { width: 100%; height: 100%; position: relative; overflow: hidden; cursor: grab; }
        #canvas-container:active { cursor: grabbing; }
        #canvas { position: absolute; top: 0; left: 0; width: 5000px; height: 5000px; background-image: radial-gradient(rgba(197, 163, 255, 0.1) 1px, transparent 0); background-size: 40px 40px; transform-origin: 0 0; }
        .card { position: absolute; background: #1f2833; border: 1px solid #45f3ff; border-radius: 8px; padding: 10px; width: 180px; min-height: 80px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); cursor: move; touch-action: none; display: flex; flex-direction: column; transition: box-shadow 0.2s; }
        .card:focus-within { box-shadow: 0 0 12px #45f3ff; border-color: #c5a3ff; }
        .card-textarea { background: transparent; border: none; color: #fff; resize: none; width: 100%; height: 100%; flex-grow: 1; font-size: 14px; outline: none; font-family: inherit; line-height: 1.4; }
        .card-delete { position: absolute; top: -8px; right: -8px; width: 20px; height: 20px; background: #ff4d4d; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; cursor: pointer; font-weight: bold; border: 1px solid #1f2833; }
        #hud { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(31, 40, 51, 0.8); padding: 8px 16px; border-radius: 20px; border: 1px solid rgba(197, 163, 255, 0.3); font-size: 12px; pointer-events: none; backdrop-filter: blur(5px); text-align: center; }
    </style>
</head>
<body>

    <div id="canvas-container">
        <div id="canvas"></div>
    </div>
    <div id="hud">Double-Tap Canvas to Spawn Thought • Drag to Move • Pinch to Zoom</div>

    <script>
        const container = document.getElementById('canvas-container');
        const canvas = document.getElementById('canvas');
        
        let panX = -2000, panY = -2000, scale = 1;
        let isPanning = false, startX, startY;
        let activeCard = null, initialX, initialY, currentX, currentY;
        let lastTap = 0, touchStartDist = 0, initialScale = 1;

        function updateTransform() {
            canvas.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
        }
        updateTransform();

        // Canvas Panning & Mouse Interactions
        container.addEventListener('mousedown', (e) => {
            if (e.target === container || e.target === canvas) {
                isPanning = true;
                startX = e.clientX - panX;
                startY = e.clientY - panY;
            }
        });

        window.addEventListener('mousemove', (e) => {
            if (isPanning) {
                panX = e.clientX - startX;
                panY = e.clientY - startY;
                updateTransform();
            } else if (activeCard) {
                const dx = (e.clientX - initialX) / scale;
                const dy = (e.clientY - initialY) / scale;
                activeCard.style.left = `${currentX + dx}px`;
                activeCard.style.top = `${currentY + dy}px`;
            }
        });

        window.addEventListener('mouseup', () => { isPanning = false; activeCard = null; });

        // Double Click/Tap to Spawn Cards
        container.addEventListener('touchend', (e) => {
            if (e.target !== container && e.target !== canvas) return;
            const now = Date.now();
            if (now - lastTap < 300) {
                const touch = e.changedTouches[0];
                const rect = canvas.getBoundingClientRect();
                const x = (touch.clientX - rect.left) / scale;
                const y = (touch.clientY - rect.top) / scale;
                createCard(x, y);
            }
            lastTap = now;
        });

        container.addEventListener('dblclick', (e) => {
            if (e.target !== container && e.target !== canvas) return;
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX - rect.left) / scale;
            const y = (e.clientY - rect.top) / scale;
            createCard(x, y);
        });

        function createCard(x, y) {
            const card = document.createElement('div');
            card.className = 'card';
            card.style.left = `${x - 90}px`;
            card.style.top = `${y - 40}px`;

            const txt = document.createElement('textarea');
            txt.className = 'card-textarea';
            txt.placeholder = 'Brain dump...';
            
            const del = document.createElement('div');
            del.className = 'card-delete';
            del.innerText = '×';
            del.onclick = (e) => { e.stopPropagation(); card.remove(); };

            card.appendChild(txt);
            card.appendChild(del);
            canvas.appendChild(card);

            setupCardGestures(card);
            setTimeout(() => txt.focus(), 50);
        }

        function setupCardGestures(card) {
            card.addEventListener('mousedown', (e) => {
                if (e.target.className === 'card-delete') return;
                activeCard = card;
                initialX = e.clientX; initialY = e.clientY;
                currentX = parseFloat(card.style.left); currentY = parseFloat(card.style.top);
                e.stopPropagation();
            });

            card.addEventListener('touchstart', (e) => {
                if (e.target.className === 'card-delete') return;
                activeCard = card;
                const touch = e.touches[0];
                initialX = touch.clientX; initialY = touch.clientY;
                currentX = parseFloat(card.style.left); currentY = parseFloat(card.style.top);
                e.stopPropagation();
            }, {passive: true});
        }

        // Mobile Touch Gestures (Pan & Pinch Zoom)
        container.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1 && (e.target === container || e.target === canvas)) {
                isPanning = true;
                startX = e.touches[0].clientX - panX;
                startY = e.touches[0].clientY - panY;
            } else if (e.touches.length === 2) {
                isPanning = false; activeCard = null;
                touchStartDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                initialScale = scale;
            }
        }, {passive: true});

        container.addEventListener('touchmove', (e) => {
            if (isPanning && e.touches.length === 1) {
                panX = e.touches[0].clientX - startX;
                panY = e.touches[0].clientY - startY;
                updateTransform();
            } else if (activeCard && e.touches.length === 1) {
                const touch = e.touches[0];
                const dx = (touch.clientX - initialX) / scale;
                const dy = (touch.clientY - initialY) / scale;
                activeCard.style.left = `${currentX + dx}px`;
                activeCard.style.top = `${currentY + dy}px`;
            } else if (e.touches.length === 2) {
                const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
                scale = Math.min(Math.max(initialScale * (dist / touchStartDist), 0.3), 3);
                updateTransform();
            }
        }, {passive: true});

        container.addEventListener('touchend', () => { isPanning = false; activeCard = null; });
    </script>
</body>
</html>
